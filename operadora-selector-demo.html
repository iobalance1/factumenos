<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FactuMenos - Selector de Operadoras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f8f8;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 60px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .section-label {
            color: #00C47D;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        h2 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #000;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 48px;
            line-height: 1.7;
        }

        .operadora-label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            color: #000;
            margin-bottom: 20px;
        }

        .grid-operadoras {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 32px;
        }

        .operadora-btn {
            padding: 20px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 14px;
            font-weight: 600;
            color: #000;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-family: 'Poppins', sans-serif;
        }

        .operadora-btn:hover {
            border-color: #00C47D;
            background: #EAF8F1;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 196, 125, 0.12);
        }

        .operadora-btn.selected {
            border-color: #00C47D;
            background: #EAF8F1;
            box-shadow: 0 0 0 3px rgba(0, 196, 125, 0.15);
        }

        .operadora-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }

        .icon-movistar {
            background: #0B3D2E;
        }

        .icon-vodafone {
            background: #DC241F;
        }

        .icon-orange {
            background: #FF6600;
        }

        .icon-yoigo {
            background: #5B2A80;
        }

        .icon-masmovil {
            background: #00A651;
        }

        .icon-otra {
            background: #999;
        }

        .confirmacion {
            padding: 16px;
            background: #EAF8F1;
            border-radius: 12px;
            border: 2px solid #00C47D;
            text-align: center;
            display: none;
            margin-bottom: 32px;
        }

        .confirmacion.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .confirmacion p {
            color: #0B3D2E;
            font-weight: 500;
            font-size: 16px;
            margin: 0;
        }

        .confirmacion .operadora-name {
            font-weight: 700;
            font-size: 18px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slider-placeholder {
            background: #f0f0f0;
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            color: #999;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 24px;
            }

            h2 {
                font-size: 32px;
            }

            .grid-operadoras {
                grid-template-columns: repeat(3, 1fr);
            }

            .operadora-btn {
                padding: 16px 12px;
                font-size: 13px;
                gap: 8px;
            }

            .operadora-icon {
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="section-label">EL PROCESO</span>
        <h2>Tres pasos.<br>Tú no haces nada.</h2>
        <p class="subtitle">Nos encargamos de todo. Solo necesitas mandarnos tu factura.</p>

        <label class="operadora-label">¿Cuál es tu operadora?</label>

        <div class="grid-operadoras">
            <button class="operadora-btn" data-operadora="Movistar">
                <div class="operadora-icon icon-movistar">M</div>
                <span>Movistar</span>
            </button>

            <button class="operadora-btn" data-operadora="Vodafone">
                <div class="operadora-icon icon-vodafone">V</div>
                <span>Vodafone</span>
            </button>

            <button class="operadora-btn" data-operadora="Orange">
                <div class="operadora-icon icon-orange">O</div>
                <span>Orange</span>
            </button>

            <button class="operadora-btn" data-operadora="Yoigo">
                <div class="operadora-icon icon-yoigo">Y</div>
                <span>Yoigo</span>
            </button>

            <button class="operadora-btn" data-operadora="MásMóvil">
                <div class="operadora-icon icon-masmovil">+M</div>
                <span>MásMóvil</span>
            </button>

            <button class="operadora-btn" data-operadora="Otra">
                <div class="operadora-icon icon-otra">?</div>
                <span>Otra</span>
            </button>
        </div>

        <div class="confirmacion" id="confirmacion">
            <p>✓ Seleccionado: <span class="operadora-name" id="operadora-seleccionada"></span></p>
        </div>

        <div class="slider-placeholder">
            <p>El slider con los tres pasos iría aquí</p>
        </div>
    </div>

    <script>
        const botones = document.querySelectorAll('.operadora-btn');
        const confirmacion = document.getElementById('confirmacion');
        const operadoraSeleccionada = document.getElementById('operadora-seleccionada');

        botones.forEach(btn => {
            btn.addEventListener('click', function() {
                // Quita selected de todos
                botones.forEach(b => b.classList.remove('selected'));
                
                // Añade selected al clickeado
                this.classList.add('selected');
                
                // Actualiza y muestra confirmación
                operadoraSeleccionada.textContent = this.dataset.operadora;
                confirmacion.classList.add('active');
            });
        });
    </script>
</body>
</html>
